persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

max_inflight_messages 20
max_queued_messages 100

# TLS 리스너(8883)는 인증서가 있을 때 entrypoint.sh 가 생성한다
include_dir /mosquitto/data/conf.d
